name: Deploy Chasing Her to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Vite application for GitHub Pages
        env:
          # Automatically uses the repository subpath (e.g. /repo-name/) or / for custom domains
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || './' }}
          NODE_ENV: production
        run: |
          BASE_PATH="${VITE_BASE_PATH}"
          if [ -n "$BASE_PATH" ] && [ "$BASE_PATH" != "./" ] && [ "${BASE_PATH: -1}" != "/" ]; then
            BASE_PATH="${BASE_PATH}/"
          fi
          VITE_BASE_PATH="$BASE_PATH" npm run build

      - name: Enable SPA fallback for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
